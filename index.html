<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STARWAVE · 智能洗发按摩梳</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: '#3f3b49',
              rose: '#f58dbd',
              blush: '#fff0f6',
              violet: '#8279cf',
              cloud: '#f7f6fa',
              ocean: '#a7cfe0'
            },
            boxShadow: {
              float: '0 18px 48px rgba(101, 84, 126, .14)',
              soft: '0 8px 22px rgba(101, 84, 126, .10)'
            }
          }
        }
      }
    </script>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #eceaf2; }
      body { font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif; color: #3f3b49; }
      button, input { font: inherit; }
      button { -webkit-tap-highlight-color: transparent; }
      .app-shell { width: min(100%, 430px); min-height: 100vh; margin: 0 auto; background: #f8f7fb; position: relative; overflow: hidden; }
      @media (min-width: 700px) {
        body { padding: 24px; }
        .app-shell { min-height: min(900px, calc(100vh - 48px)); border-radius: 42px; box-shadow: 0 24px 70px rgba(70, 59, 90, .18); }
      }
      .screen { min-height: 100vh; padding: 22px 20px 106px; animation: rise .28s ease both; }
      @media (min-width: 700px) { .screen { min-height: min(900px, calc(100vh - 48px)); } }
      @keyframes rise { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .noise { background-image: radial-gradient(rgba(255,255,255,.44) .7px, transparent .7px); background-size: 8px 8px; }
      .glass { background: rgba(255,255,255,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.85); }
      .pink-gradient { background: linear-gradient(140deg, #f7a7c8 0%, #f19abb 48%, #df7dad 100%); }
      .lilac-gradient { background: linear-gradient(140deg, #e4daf2 0%, #d2c7ec 100%); }
      .ocean-gradient { background: linear-gradient(140deg, #d6edf3 0%, #acd4e3 100%); }
      .progress-ring { transform: rotate(-90deg); transform-origin: 50% 50%; }
      .scroll-hide::-webkit-scrollbar { display:none; }
      .scroll-hide { scrollbar-width:none; }
      .active-nav { color: #e76eaa; }
      .active-nav .nav-dot { background: #f8b5d1; box-shadow: 0 0 0 6px rgba(248,181,209,.22); }
      .mode-pill.active { background: #493f58; color: white; box-shadow: 0 6px 16px rgba(73,63,88,.18); }
      .toast { animation: toast-in .3s ease both; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(12px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .pulse-dot { animation: pulse 1.8s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(75, 184, 144, .32); } 55% { box-shadow: 0 0 0 7px rgba(75, 184, 144, 0); } }
      input[type="range"] { accent-color: #ee82b2; }
      .slide-up { animation: slide-up .28s ease both; }
      @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .product-art { filter: drop-shadow(0 16px 16px rgba(186, 102, 139, .22)); }
      .product-photo { filter: drop-shadow(0 16px 16px rgba(186, 102, 139, .22)); object-fit: contain; }
    </style>
  </head>
  <body>
    <main class="app-shell">
      <div id="app"></div>
      <div id="toast-root" class="fixed left-1/2 bottom-24 z-50 -translate-x-1/2 pointer-events-none"></div>
    </main>

    <script>
      const icons = {
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m3.5 10.6 8.5-7 8.5 7"/><path d="M5.4 9.6v10.1h13.2V9.6M9.2 19.7v-6h5.6v6"/></svg>',
        report: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19.5V5.7c0-.7.5-1.2 1.2-1.2h11.6c.7 0 1.2.5 1.2 1.2v13.8"/><path d="M5 18.5c0-1 1-1.8 2-1.8h12M9 8h6M9 11.5h6M9 15h3"/></svg>',
        bag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8.5h14l-1 11H6l-1-11Z"/><path d="M9 9V6.8a3 3 0 0 1 6 0V9"/></svg>',
        community: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5.4 17.8a7.4 7.4 0 1 1 3 2.3l-3.7.6.7-2.9Z"/><path d="M8.4 11.2h.1M12 11.2h.1M15.6 11.2h.1" stroke-linecap="round" stroke-width="2.7"/></svg>',
        chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 5 7 7-7 7"/></svg>',
        plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
        close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>',
        link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.8 14.2 14.2 9.8"/><path d="m7.8 16.2-1.2 1.2a3.2 3.2 0 0 1-4.5-4.5l3.7-3.7a3.2 3.2 0 0 1 4.5 0"/><path d="m16.2 7.8 1.2-1.2a3.2 3.2 0 0 1 4.5 4.5l-3.7 3.7a3.2 3.2 0 0 1-4.5 0"/></svg>',
        play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m8 5.3 10.3 6.7L8 18.7V5.3Z"/></svg>',
        pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h3.2v14H7zM13.8 5H17v14h-3.2z"/></svg>',
        arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
        bolt: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m13.3 2-8 11h6.2L10.7 22l8-11h-6.2L13.3 2Z"/></svg>',
        spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m12 2 1.5 6.5L20 10l-6.5 1.6L12 18l-1.6-6.4L4 10l6.4-1.5L12 2Z"/><path d="m19 16 .6 2.4L22 19l-2.4.6L19 22l-.6-2.4L16 19l2.4-.6L19 16Z"/></svg>',
        gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/><path d="m19.2 13.8 1.3 1-.9 1.7-1.6-.5a7.6 7.6 0 0 1-1.9 1.1l-.2 1.7h-2l-.5-1.6a7.5 7.5 0 0 1-2.2 0l-.5 1.6h-2l-.2-1.7a7.6 7.6 0 0 1-1.9-1.1l-1.6.5-.9-1.7 1.3-1a7.3 7.3 0 0 1 0-2.5l-1.3-1 .9-1.7 1.6.5a7.6 7.6 0 0 1 1.9-1.1l.2-1.7h2l.5 1.6a7.5 7.5 0 0 1 2.2 0l.5-1.6h2l.2 1.7a7.6 7.6 0 0 1 1.9 1.1l1.6-.5.9 1.7-1.3 1a7.3 7.3 0 0 1 0 2.5Z"/></svg>'
      };

      const state = {
        tab: 'home',
        deviceConnected: true,
        mode: '洗发',
        intensity: 2,
        sessionRunning: false,
        elapsed: 0,
        cart: 0,
        showSession: false,
        showReport: false,
        toastTimer: null
      };

      const modeData = {
        洗发: { icon: '🫧', desc: '清洁头皮 · 建议 3 分钟', color: 'pink-gradient' },
        护发素: { icon: '🪷', desc: '顺滑发丝 · 建议 2 分钟', color: 'lilac-gradient' },
        护发精油: { icon: '✨', desc: '滋养发尾 · 建议 90 秒', color: 'ocean-gradient' },
        按摩: { icon: '◌', desc: '放松头皮 · 建议 5 分钟', color: 'bg-[#f0d8d7]' }
      };

      function svg(name, cls = 'w-5 h-5') { return `<span class="inline-flex ${cls}">${icons[name]}</span>`; }
      function appTemplate(content) {
        return `<section class="screen">${content}</section>${bottomNav()}`;
      }
      function bottomNav() {
        const tabs = [
          ['home', '首页', 'home'], ['report', '护理', 'report'], ['shop', '商城', 'bag'], ['community', '社区', 'community']
        ];
        return `<nav class="absolute bottom-0 left-0 right-0 z-30 flex h-[88px] items-start justify-around border-t border-white/70 bg-white/85 px-3 pt-4 backdrop-blur-xl">${tabs.map(([id, label, icon]) => `<button data-tab="${id}" class="nav-item flex w-20 flex-col items-center gap-2 text-[11px] font-medium ${state.tab === id ? 'active-nav' : 'text-[#aaa6b4]'}"><span class="nav-dot flex h-7 w-7 items-center justify-center rounded-full transition">${svg(icon, 'w-[19px] h-[19px]')}</span><span>${label}</span></button>`).join('')}</nav>`;
      }
      function topbar(title, kicker, action = '') {
        return `<header class="mb-5 flex items-center justify-between"><div><p class="mb-1 text-[10px] font-semibold uppercase tracking-[.28em] text-[#b1aab8]">${kicker}</p><h1 class="text-[25px] font-bold tracking-[-.04em] text-ink">${title}</h1></div>${action}</header>`;
      }
      function avatar() { return `<div class="flex h-10 w-10 items-center justify-center rounded-full bg-[#f8bfd5] text-sm font-bold text-[#6b5262] shadow-soft">林</div>`; }
      function productArt(size = 'small') {
        const scale = size === 'large' ? 'w-[190px] h-[188px]' : 'w-[82px] h-[82px]';
        return `<div class="relative ${scale}"><img src="./asset/product-pink.png" alt="STARWAVE 粉色智能洗发按摩梳" class="product-photo h-full w-full" /></div>`;
      }
      function homeView() {
        const connected = state.deviceConnected;
        return appTemplate(`${topbar('你好，林小姐', 'Good evening', `${avatar()}`)}
          <div class="noise relative mb-5 overflow-hidden rounded-[30px] bg-[#e8dff0] p-5 shadow-soft">
            <div class="absolute -right-12 -top-16 h-44 w-44 rounded-full bg-[#f7b4d0]/55 blur-2xl"></div>
            <div class="relative z-10 flex items-start justify-between"><div><span class="mb-2 inline-flex items-center gap-1.5 rounded-full bg-white/70 px-2.5 py-1 text-[10px] font-semibold text-[#837890]"><i class="pulse-dot h-1.5 w-1.5 rounded-full bg-[#58bf95]"></i>${connected ? '设备已连接' : '设备未连接'}</span><h2 class="max-w-[180px] text-[23px] font-bold leading-[1.12] tracking-[-.04em] text-[#494354]">让头皮，<br><span class="text-[#d86e9e]">轻松呼吸</span></h2><p class="mt-2 text-[11px] leading-relaxed text-[#7d7489]">${connected ? 'STARWAVE 正在陪你开始今天的护理' : '连接设备，开启你的头皮护理'}</p></div>${productArt('large')}</div>
            <button data-action="${connected ? 'start-session' : 'connect'}" class="relative z-10 mt-1 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#494354] py-3 text-sm font-semibold text-white shadow-soft transition hover:translate-y-[-1px]">${connected ? '开始今日护理' : '连接我的 STARWAVE'} ${svg('arrow', 'h-4 w-4')}</button>
          </div>
          <div class="mb-5 flex items-center justify-between"><div><p class="text-[12px] font-semibold text-[#9d97a9]">本周护理表现</p><h3 class="mt-1 text-[18px] font-bold tracking-[-.03em]">越来越懂自己了 <span class="text-base">✦</span></h3></div><button data-action="open-report" class="flex items-center gap-1 text-[11px] font-semibold text-[#de76a7]">查看报告 ${svg('chevron','h-3 w-3')}</button></div>
          <div class="mb-6 grid grid-cols-3 gap-2.5"><div class="glass rounded-2xl p-3"><p class="text-[11px] text-[#aaa3b2]">护理次数</p><p class="mt-2 text-[22px] font-bold">04<span class="ml-1 text-xs font-medium text-[#aaa3b2]">次</span></p><div class="mt-2 h-1 rounded-full bg-[#f1e8ee]"><div class="h-1 w-[74%] rounded-full bg-[#ee8fb6]"></div></div></div><div class="glass rounded-2xl p-3"><p class="text-[11px] text-[#aaa3b2]">连续护理</p><p class="mt-2 text-[22px] font-bold">07<span class="ml-1 text-xs font-medium text-[#aaa3b2]">天</span></p><div class="mt-2 flex gap-1">${[1,2,3,4,5,6,7].map(i=>`<i class="h-1.5 flex-1 rounded-full ${i<7?'bg-[#9d93d2]':'bg-[#e9e6ed]'}"></i>`).join('')}</div></div><div class="glass rounded-2xl p-3"><p class="text-[11px] text-[#aaa3b2]">舒适度</p><p class="mt-2 text-[22px] font-bold">92<span class="ml-1 text-xs font-medium text-[#aaa3b2]">分</span></p><div class="mt-2 flex items-center gap-1 text-[10px] text-[#65ae98]">↗ 12% <span class="text-[#aaa3b2]">较上周</span></div></div></div>
          <div class="mb-3 flex items-center justify-between"><h3 class="text-[17px] font-bold tracking-[-.03em]">为你准备</h3><button data-tab="shop" class="text-[11px] font-semibold text-[#a39baa]">全部内容</button></div>
          <div class="scroll-hide -mx-1 flex gap-3 overflow-x-auto px-1 pb-2"><div class="min-w-[184px] rounded-3xl bg-[#f5dce8] p-4"><div class="flex items-start justify-between"><span class="rounded-full bg-white/70 px-2 py-1 text-[9px] font-bold text-[#bd6d95]">今日推荐</span><span class="text-lg">☁️</span></div><p class="mt-5 text-[15px] font-bold">洗发前先梳理</p><p class="mt-1 text-[10px] leading-relaxed text-[#917184]">顺着发丝梳开，减少拉扯，<br>再开启你的清洁模式。</p></div><div class="min-w-[184px] rounded-3xl bg-[#dcecf0] p-4"><div class="flex items-start justify-between"><span class="rounded-full bg-white/70 px-2 py-1 text-[9px] font-bold text-[#6793a0]">护理小知识</span><span class="text-lg">✦</span></div><p class="mt-5 text-[15px] font-bold">头皮也需要防晒</p><p class="mt-1 text-[10px] leading-relaxed text-[#6e8d96]">紫外线会影响头皮屏障，<br>夏日记得戴帽子哦。</p></div></div>`);
      }
      function reportView() {
        const data = [['头皮洁净度','86','清洁充分','bg-[#e990b7]'],['水油平衡','72','偏油，建议减少用量','bg-[#9e95d0]'],['头发光泽度','91','状态不错','bg-[#8bc8c1]'],['分叉状况','68','发尾需要更多滋养','bg-[#e9b072]'],['脱发状况','94','在舒适范围内','bg-[#91b8d8]']];
        return appTemplate(`${topbar('护理报告', 'My care report', `<button data-action="open-info" class="flex h-10 w-10 items-center justify-center rounded-full bg-white text-[#9d96a5] shadow-soft">?</button>`)}
          <div class="relative mb-5 overflow-hidden rounded-[30px] bg-[#3e3948] p-5 text-white"><div class="absolute -right-16 -top-16 h-40 w-40 rounded-full bg-[#8f81c9]/40 blur-2xl"></div><div class="relative flex items-start justify-between"><div><p class="text-[11px] text-white/55">最近一次记录 · 今天 20:42</p><h2 class="mt-2 text-[25px] font-bold tracking-[-.04em]">头皮状态不错 <span class="text-[#ffb3cf]">✦</span></h2><p class="mt-2 max-w-[220px] text-[11px] leading-relaxed text-white/65">持续保持每周 3–4 次的护理频率，给自己一点耐心。</p></div><div class="flex h-16 w-16 items-center justify-center rounded-full border-4 border-[#f5a6c8] text-center"><div><strong class="block text-xl leading-none">84</strong><span class="text-[9px] text-white/60">综合分</span></div></div></div><div class="mt-5 flex items-center gap-2 rounded-2xl bg-white/10 p-3 text-[10px] text-white/70">${svg('spark','h-4 w-4 text-[#ffb3cf]')} 本次数据来自 18 分钟前的设备使用记录</div></div>
          <div class="mb-4 flex items-center justify-between"><h3 class="text-[17px] font-bold tracking-[-.03em]">五维状态</h3><span class="text-[10px] text-[#aaa4b2]">非医疗诊断结果</span></div>
          <div class="mb-5 space-y-2.5">${data.map(([name, score, note, color])=>`<div class="glass rounded-2xl p-3"><div class="mb-2 flex items-center justify-between"><span class="text-[12px] font-semibold">${name}</span><span class="text-[11px] font-bold text-[#8b8492]">${score}<small class="ml-0.5 font-normal">/100</small></span></div><div class="h-2 overflow-hidden rounded-full bg-[#eeecf1]"><div class="h-full rounded-full ${color}" style="width:${score}%"></div></div><p class="mt-2 text-[10px] text-[#aaa3b0]">${note}</p></div>`).join('')}</div>
          <div class="rounded-3xl bg-[#f5e4ed] p-4"><div class="flex items-start justify-between"><div><span class="text-[10px] font-bold text-[#b86791]">PERSONAL ROUTINE</span><h3 class="mt-1 text-[16px] font-bold">你的专属用量建议</h3></div><span class="text-2xl">🫧</span></div><div class="mt-4 grid grid-cols-3 gap-2 text-center">${[['洗发水','2泵','洁净优先'],['护发素','1泵','重点发尾'],['护发精油','2滴','避免头皮']].map(([a,b,c])=>`<div class="rounded-2xl bg-white/70 p-3"><p class="text-[10px] text-[#a895a2]">${a}</p><strong class="mt-1 block text-[17px]">${b}</strong><span class="mt-1 block text-[9px] text-[#b86791]">${c}</span></div>`).join('')}</div></div>`);
      }
      function shopView() {
        const products = [['云朵净澈洗发水','适合偏油头皮','¥129','🫧','bg-[#e9f2ef]'],['柔光修护护发素','改善干枯发尾','¥159','🌷','bg-[#f3e8f2]'],['晚安舒缓护发精油','睡前放松护理','¥199','✨','bg-[#f6e3dc]'],['深层滋养发膜','每周一次加强护理','¥189','🥥','bg-[#e8eef5]']];
        return appTemplate(`${topbar('护理商城', 'Curated for you', `<button data-action="cart" class="relative flex h-10 w-10 items-center justify-center rounded-full bg-white text-[#8f8796] shadow-soft">${svg('bag','h-5 w-5')}${state.cart ? `<i class="absolute right-1 top-1 flex h-4 w-4 items-center justify-center rounded-full bg-[#e781ad] text-[9px] font-bold text-white">${state.cart}</i>` : ''}</button>`)}
          <div class="mb-5 flex gap-2 overflow-x-auto pb-1 scroll-hide">${['为你推荐','洗发水','护发素','精油','发膜'].map((t,i)=>`<button class="whitespace-nowrap rounded-full px-4 py-2 text-[11px] font-semibold ${i===0?'bg-[#4a4354] text-white':'bg-white text-[#a49ca9]'}">${t}</button>`).join('')}</div>
          <div class="mb-5 overflow-hidden rounded-[28px] bg-[#dfeaf0] p-5"><div class="flex items-center justify-between"><div><span class="rounded-full bg-white/70 px-2.5 py-1 text-[9px] font-bold text-[#70929e]">ROUTINE EDIT</span><h2 class="mt-3 text-[20px] font-bold tracking-[-.04em]">把洗护交给<br><span class="text-[#6b99a7]">更懂你的配方</span></h2><button class="mt-4 flex items-center gap-1.5 rounded-xl bg-white/75 px-3 py-2 text-[10px] font-semibold text-[#618995]">查看组合 ${svg('arrow','h-3 w-3')}</button></div><div class="text-[68px] opacity-90">🧴</div></div></div>
          <div class="mb-3 flex items-center justify-between"><h3 class="text-[17px] font-bold tracking-[-.03em]">为你挑选</h3><span class="text-[10px] text-[#aaa3b0]">基于最近一次护理</span></div>
          <div class="grid grid-cols-2 gap-3">${products.map(([name,desc,price,emoji,bg])=>`<article class="overflow-hidden rounded-3xl bg-white shadow-[0_4px_16px_rgba(101,84,126,.06)]"><div class="relative flex h-[138px] items-center justify-center ${bg}"><span class="text-[57px] drop-shadow-[0_10px_8px_rgba(80,60,90,.12)]">${emoji}</span><button data-action="add-cart" class="absolute bottom-3 right-3 flex h-8 w-8 items-center justify-center rounded-full bg-white text-[#d878a3] shadow-soft">${svg('plus','h-4 w-4')}</button></div><div class="p-3.5"><h4 class="text-[13px] font-bold">${name}</h4><p class="mt-1 text-[10px] text-[#aaa3b0]">${desc}</p><p class="mt-3 text-[14px] font-bold text-[#7d7282]">${price}</p></div></article>`).join('')}</div>`);
      }
      function communityView() {
        const posts = [['王梓萱','终于把洗头变成了放松仪式','今天用按摩模式 5 分钟，吹完头发感觉头皮很轻，推荐给和我一样容易紧绷的人～','2.8w','10m','🌸'],['小 芙','发尾护理打卡第 21 天','以前总觉得护发素涂了也没用，后来按照报告的建议只涂发尾，现在梳头顺滑好多！','1.5w','昨天 20:01','🪻'],['Mia','关于精油的正确打开方式','精油真的不要直接抹在头皮上哦，我会在掌心搓热后带过发尾。','892','周一','🌙']];
        return appTemplate(`${topbar('发现灵感', 'Share your ritual', `<button data-action="new-post" class="flex h-10 w-10 items-center justify-center rounded-full bg-[#4a4354] text-white shadow-soft">${svg('plus','h-5 w-5')}</button>`)}
          <div class="mb-5 rounded-3xl bg-[#f6dfe9] p-4"><div class="flex items-center gap-3"><div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-white/70 text-xl">✦</div><div><p class="text-[11px] font-bold text-[#a75c82]">今日社区话题</p><p class="mt-1 text-[14px] font-bold">你的洗护仪式感是什么？</p></div>${svg('chevron','ml-auto h-4 w-4 text-[#b86a90]')}</div></div>
          <div class="mb-4 flex gap-2">${['推荐','关注','护理日记','小知识'].map((t,i)=>`<button class="rounded-full px-4 py-2 text-[11px] font-semibold ${i===0?'bg-[#4a4354] text-white':'bg-white text-[#a8a0ad]'}">${t}</button>`).join('')}</div>
          <div class="space-y-3">${posts.map(([name,title,body,likes,time,avatar])=>`<article class="rounded-3xl bg-white p-4 shadow-[0_4px_16px_rgba(101,84,126,.05)]"><div class="flex items-center gap-2.5"><div class="flex h-9 w-9 items-center justify-center rounded-full bg-[#f7d4e1] text-base">${avatar}</div><div><p class="text-[12px] font-bold">${name}</p><p class="text-[9px] text-[#b2aab5]">STARWAVE 体验官 · ${time}</p></div><button class="ml-auto rounded-full bg-[#fff1f6] px-2.5 py-1 text-[9px] font-bold text-[#d875a4]">+ 关注</button></div><h3 class="mt-4 text-[14px] font-bold">${title}</h3><p class="mt-2 text-[11px] leading-relaxed text-[#88818f]">${body}</p><div class="mt-4 flex items-center gap-4 text-[10px] text-[#aaa2ae]"><span>♡ ${likes}</span><span>◌ 24</span><span class="ml-auto">分享</span></div></article>`).join('')}</div>`);
      }
      function sessionOverlay() {
        if (!state.showSession) return '';
        const d = modeData[state.mode];
        const mins = String(Math.floor(state.elapsed / 60)).padStart(2,'0');
        const secs = String(state.elapsed % 60).padStart(2,'0');
        const progress = Math.min(100, Math.round((state.elapsed / 180) * 100));
        return `<div class="absolute inset-0 z-40 flex items-end bg-[#2c2735]/35"><div class="slide-up w-full rounded-t-[32px] bg-[#f9f8fb] px-5 pb-7 pt-4 shadow-[0_-14px_40px_rgba(56,45,69,.18)]"><div class="mx-auto mb-5 h-1 w-10 rounded-full bg-[#ded9e1]"></div><div class="mb-5 flex items-center justify-between"><div><p class="text-[10px] font-bold uppercase tracking-[.24em] text-[#aaa2b0]">LIVE RITUAL</p><h2 class="mt-1 text-[22px] font-bold tracking-[-.04em]">开始护理</h2></div><button data-action="close-session" class="flex h-9 w-9 items-center justify-center rounded-full bg-white text-[#aaa3b0] shadow-soft">${svg('close','h-4 w-4')}</button></div><div class="mb-4 flex items-center justify-between rounded-3xl bg-[#e9dfef] p-4"><div><span class="text-[10px] font-bold text-[#8f7b9e]">${state.deviceConnected ? '设备在线 · 电量 82%' : '设备未连接'}</span><h3 class="mt-1 text-[16px] font-bold">${d.icon} ${state.mode}模式</h3><p class="mt-1 text-[10px] text-[#8f7b9e]">${d.desc}</p></div>${productArt('small')}</div><div class="mb-4 grid grid-cols-4 gap-2">${Object.keys(modeData).map(m=>`<button data-mode="${m}" class="mode-pill ${state.mode===m?'active':''} rounded-2xl bg-white px-2 py-3 text-center text-[10px] font-semibold text-[#9e97a5] shadow-[0_3px_12px_rgba(101,84,126,.05)]"><span class="mb-1 block text-lg">${modeData[m].icon}</span>${m}</button>`).join('')}</div><div class="mb-4 rounded-3xl bg-white p-4 shadow-[0_3px_14px_rgba(101,84,126,.06)]"><div class="flex items-center justify-between"><div><p class="text-[10px] text-[#aaa3b0]">当前强度</p><p class="mt-1 text-[22px] font-bold">${state.intensity}<span class="ml-1 text-xs font-medium text-[#aaa3b0]">/ 3</span></p></div><div class="text-right"><p class="text-[10px] text-[#aaa3b0]">已护理</p><p class="mt-1 text-[22px] font-bold text-[#d878a3]">${mins}:${secs}</p></div></div><input data-action="intensity" type="range" min="1" max="3" value="${state.intensity}" class="mt-4 w-full"/><div class="mt-1 flex justify-between text-[9px] text-[#b3acb7]"><span>轻柔</span><span>标准</span><span>深层</span></div></div><div class="mb-4 overflow-hidden rounded-3xl bg-[#3e3948] p-4 text-white"><div class="mb-3 flex items-center justify-between"><span class="text-[11px] font-semibold">头皮清洁地图</span><span class="flex items-center gap-1 text-[9px] text-[#a8a0b7]"><i class="h-1.5 w-1.5 rounded-full bg-[#ef89b4]"></i>正在检测</span></div><div class="grid grid-cols-4 gap-1.5">${[1,2,3,4,5,6,7,8].map(i=>`<div class="h-7 rounded-lg ${i === 3 || i === 7 ? 'bg-[#e883ae]' : i === 4 ? 'bg-[#d4a6cd]' : 'bg-[#655d75]'} ${state.sessionRunning && i===3 ? 'animate-pulse' : ''}"></div>`).join('')}</div><p class="mt-3 text-[9px] text-white/50">${state.sessionRunning ? '建议向右上方移动，那里还需要再清洁一次' : '开始后，梳子会实时同步清洁区域'}</p></div><button data-action="toggle-session" class="flex w-full items-center justify-center gap-2 rounded-2xl bg-[#ed83b2] py-3.5 text-sm font-bold text-white shadow-[0_9px_20px_rgba(237,131,178,.26)]">${state.sessionRunning ? svg('pause','h-4 w-4') + ' 暂停护理' : svg('play','h-4 w-4') + ' 开始护理'}</button></div></div>`;
      }
      function render() {
        const view = state.tab === 'home' ? homeView() : state.tab === 'report' ? reportView() : state.tab === 'shop' ? shopView() : communityView();
        document.querySelector('#app').innerHTML = view + sessionOverlay();
        bindEvents();
      }
      function toast(message) {
        const root = document.querySelector('#toast-root');
        root.innerHTML = `<div class="toast flex items-center gap-2 whitespace-nowrap rounded-full bg-[#443d50] px-4 py-2.5 text-[11px] font-semibold text-white shadow-float">${message}</div>`;
        clearTimeout(state.toastTimer); state.toastTimer = setTimeout(()=>root.innerHTML='', 2200);
      }
      function bindEvents() {
        document.querySelectorAll('[data-tab]').forEach(el => el.addEventListener('click', () => { state.tab = el.dataset.tab; state.showSession = false; render(); }));
        document.querySelectorAll('[data-action="start-session"]').forEach(el => el.addEventListener('click', () => { state.showSession = true; render(); }));
        document.querySelectorAll('[data-action="connect"]').forEach(el => el.addEventListener('click', () => { state.deviceConnected = true; toast('STARWAVE 已连接 · 电量 82%'); render(); }));
        document.querySelectorAll('[data-action="open-report"]').forEach(el => el.addEventListener('click', () => { state.tab = 'report'; render(); }));
        document.querySelectorAll('[data-action="close-session"]').forEach(el => el.addEventListener('click', () => { state.showSession = false; state.sessionRunning = false; render(); }));
        document.querySelectorAll('[data-action="toggle-session"]').forEach(el => el.addEventListener('click', () => { state.sessionRunning = !state.sessionRunning; toast(state.sessionRunning ? '护理已开始，跟着提示慢慢来' : '护理已暂停'); render(); }));
        document.querySelectorAll('[data-mode]').forEach(el => el.addEventListener('click', () => { state.mode = el.dataset.mode; toast(`已切换至${state.mode}模式`); render(); }));
        document.querySelectorAll('[data-action="intensity"]').forEach(el => el.addEventListener('input', () => { state.intensity = Number(el.value); render(); }));
        document.querySelectorAll('[data-action="add-cart"]').forEach(el => el.addEventListener('click', () => { state.cart += 1; toast('已加入护理清单'); render(); }));
        document.querySelectorAll('[data-action="cart"]').forEach(el => el.addEventListener('click', () => toast(state.cart ? `护理清单里有 ${state.cart} 件好物` : '护理清单还是空的哦')));
        document.querySelectorAll('[data-action="new-post"]').forEach(el => el.addEventListener('click', () => toast('分享功能即将开放，先记录今天的护理吧')));
        document.querySelectorAll('[data-action="open-info"]').forEach(el => el.addEventListener('click', () => toast('数据来自设备使用记录，仅用于日常护理参考')));
      }
      setInterval(() => { if (state.sessionRunning && state.showSession) { state.elapsed += 1; const active = document.querySelector('.slide-up'); if (active) { render(); } } }, 1000);
      render();
    </script>
  </body>
</html>
